services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StayDesk#2026_Dev"
    ports:
      - "1433:1433"
    volumes:
      - staydesk-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  staydesk-api:
    build:
      context: .
      dockerfile: StayDesk.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__StayDesk: "Server=sqlserver,1433;Database=StayDesk;User Id=sa;Password=StayDesk#2026_Dev;TrustServerCertificate=True;"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  staydesk-web:
    build:
      context: .
      dockerfile: StayDesk.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      StayDeskApi__BaseUrl: "http://staydesk-api:8080"
    ports:
      - "5100:8080"
    depends_on:
      - staydesk-api

volumes:
  staydesk-sqldata:
